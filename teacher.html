<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿈꾸는 학교 · 관리</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#37352F;--sub:#787774;--line:#E9E9E7;--hover:#F7F7F5;--accent:#2383E2;--red:#E03E3E}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:14.5px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:48px 28px 100px}
h1{font-size:32px;font-weight:700;margin:0 0 4px}
.top-sub{color:var(--sub);font-size:14px;margin-bottom:28px;display:flex;gap:14px;flex-wrap:wrap}
.top-sub a{color:var(--sub)}
h2{font-size:18px;font-weight:700;margin:36px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-size:26px;font-weight:700;line-height:1.2}
.stat span{color:var(--sub);font-size:13px}
.tabs{display:flex;gap:2px;margin:28px 0 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--sub);text-align:left;font-size:13px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row:hover td{background:var(--hover)}
tr.row{cursor:pointer}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--sub)}
.tag{display:inline-block;font-size:12px;background:#F1F1EF;border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0;color:#5F5E5B}
.tag.new{background:#E7F3F8;color:#1F6C9F}
.tag.sample{background:var(--ink);color:#fff}
.lbtn{border:0;background:none;color:var(--sub);padding:2px 6px;border-radius:4px;font-size:13px}
.lbtn:hover{background:#EFEFED;color:var(--ink)}
.lbtn.del:hover{color:var(--red);background:#FBE4E4}
.detail td{background:#FBFBFA;padding:16px 18px 18px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dgrid h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.cl{margin:0;padding:0;list-style:none}
.cl li{padding:4px 0;border-bottom:1px dashed var(--line)}
.cl li .why{color:var(--sub);font-size:13px;margin-top:1px}
.stuline{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.stuline .n{color:var(--sub);font-size:13px}
.rank{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.bar{display:flex;align-items:center;gap:8px;padding:4px 0}
.bar .nm{flex:0 0 170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{flex:1;height:8px;background:#F1F1EF;border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);opacity:.75;border-radius:4px}
.bar .c{flex:0 0 28px;text-align:right;color:var(--sub);font-size:13px}
.empty{color:var(--sub);padding:18px 0}
.newlist .item{padding:10px 0;border-bottom:1px solid var(--line)}
.newlist .item b{font-weight:600}
.newlist .item .meta{color:var(--sub);font-size:13px}
.newlist .item .desc{font-size:13.5px;margin-top:2px}
.newlist .item .why{font-size:13.5px;color:#5F5E5B;margin-top:2px}
.danger{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:13px}
.danger button{border:1px solid #F1CACA;background:#fff;color:var(--red);border-radius:6px;padding:6px 12px;font-size:13px}
.danger button:hover{background:#FBE4E4}
.search{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;font-size:14px;width:220px;outline:none}
.search:focus{border-color:#C9C9C6}
.tool{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;gap:10px;flex-wrap:wrap}
/* 잠금 */
#lock{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9}
#lock form{display:flex;flex-direction:column;gap:10px;width:240px}
#lock input{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;font-size:16px;text-align:center;letter-spacing:.3em;outline:none}
#lock input:focus{border-color:#C9C9C6}
#lock .e{color:var(--red);font-size:13px;text-align:center;min-height:18px}
#lock h3{text-align:center;margin:0 0 6px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:700px){
  .wrap{padding:28px 14px 80px}
  .dgrid,.rank{grid-template-columns:1fr}
  .hide-m{display:none}
  .bar .nm{flex-basis:120px}
}
</style>
</head>
<body>
<div id="lock">
  <form onsubmit="return unlock(event)">
    <h3>관리 페이지</h3>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <div class="e" id="pwErr"></div>
  </form>
</div>

<div class="wrap hidden" id="app">
  <h1>꿈꾸는 학교 · 관리</h1>
  <div class="top-sub"><a href="./" target="_blank">학생 화면 열기 ↗</a><a href="./?g" target="_blank">학교 구경하기 화면 ↗</a></div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button data-t="schools" class="on">학교 목록</button>
    <button data-t="rank">과목 통계</button>
    <button data-t="newc">새로 만든 과목</button>
  </div>

  <section id="t-schools">
    <div class="tool"><input class="search" id="q" placeholder="학교·설립자·과목 검색"><span class="muted" id="qCount"></span></div>
    <table>
      <thead><tr><th>학교</th><th class="hide-m">설립자</th><th class="num">기본</th><th class="num">선택</th><th class="num">학생</th><th class="num hide-m">만든 때</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </section>

  <section id="t-rank" class="hidden">
    <div class="rank">
      <div><h2>가장 많이 개설된 선택과목</h2><div id="rOpen"></div></div>
      <div><h2>학생들이 가장 많이 고른 선택과목</h2><div id="rPick"></div></div>
    </div>
    <div class="rank">
      <div><h2>기본과목으로 많이 넣은 과목</h2><div id="rBasic"></div></div>
      <div><h2>교과별 선택과목 수</h2><div id="rGroup"></div></div>
    </div>
  </section>

  <section id="t-newc" class="hidden">
    <div class="tool"><span class="muted" id="newCount"></span></div>
    <div class="newlist" id="newList"></div>
  </section>

  <div class="danger">
    <span>강의가 끝나면 예시 학교만 남기고 모두 지울 수 있어요.</span>
    <button onclick="wipeAll()">예시 빼고 모두 지우기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const PW = '0615', PW_KEY = 'dreamschoolTeacher';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }

function unlock(e){
  e && e.preventDefault();
  if ($('pw').value !== PW){ $('pwErr').textContent = '비밀번호가 달라요.'; $('pw').value=''; return false; }
  sessionStorage.setItem(PW_KEY,'1'); start(); return false;
}
if (sessionStorage.getItem(PW_KEY)==='1') setTimeout(start);

firebase.initializeApp({
  apiKey:"AIzaSyBtSooSc-eg4zMHQ_QF-ErmYJmtaYT1Fkg", authDomain:"limi-88231.firebaseapp.com",
  projectId:"limi-88231", storageBucket:"limi-88231.firebasestorage.app",
  messagingSenderId:"361025367626", appId:"1:361025367626:web:19d4e19d54558d4a79c0b3"
});
const db = firebase.firestore();
const SCH = db.collection('dreamschool_schools'), TT = db.collection('dreamschool_timetables');
let schools = [], tts = [], open = new Set(), started = false;
const roleOf = c => c.role || 'elective';
const basics = s => (s.courses||[]).filter(c=>roleOf(c)==='basic');
const electives = s => (s.courses||[]).filter(c=>roleOf(c)==='elective');

function start(){
  if (started) return; started = true;
  $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
  SCH.onSnapshot(sn => { schools = sn.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.name);
    schools.sort((a,b)=>(b.isSample?1:0)-(a.isSample?1:0) || (b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)); render(); });
  TT.onSnapshot(sn => { tts = sn.docs.map(d=>({id:d.id,...d.data()})); render(); });
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = ()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['schools','rank','newc'].forEach(t => $('t-'+t).classList.toggle('hidden', t!==b.dataset.t));
});
$('q').oninput = renderList;

function fmt(ts){ try{ const d=ts.toDate(); return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }catch(e){ return '-'; } }
const real = () => schools.filter(s=>!s.isSample);
const realTT = () => { const ids = new Set(real().map(s=>s.id)); return tts.filter(t=>ids.has(t.schoolId)); };
const isSampleStu = t => schools.find(s=>s.id===t.schoolId)?.isSample && ['학생 A','학생 B'].includes(t.student);
const allTT = () => tts.filter(t=>schools.some(s=>s.id===t.schoolId) && !isSampleStu(t));

function render(){ renderStats(); renderList(); renderRank(); renderNew(); }

function renderStats(){
  const r = real(), t = allTT();
  const visits = t.filter(x=>!x.founder).length;
  const newc = r.reduce((n,s)=>n+(s.courses||[]).filter(c=>c.kind==='new').length,0);
  $('stats').innerHTML = [
    [r.length,'세워진 학교'],[t.length,'시간표'],[visits,'남의 학교 입학'],[newc,'새로 만든 과목'],
  ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('') + `<div class="stat"><b class="muted" style="font-size:13px;font-weight:400;padding-top:10px">예시 학교·예시 학생 제외</b></div>`;
}

function renderList(){
  const q = $('q').value.trim();
  const list = schools.filter(s => !q || [s.name,s.founder,s.forWhom,...(s.courses||[]).map(c=>c.name)].join(' ').includes(q));
  $('qCount').textContent = q ? `${list.length}개` : '';
  if (!list.length){ $('list').innerHTML = `<tr><td colspan="7" class="empty">${q?'찾는 학교가 없어요.':'아직 세워진 학교가 없어요.'}</td></tr>`; return; }
  $('list').innerHTML = list.map(s => {
    const st = tts.filter(t=>t.schoolId===s.id);
    const row = `<tr class="row" data-id="${s.id}">
      <td><b>${esc(s.name)}</b> ${s.isSample?'<span class="tag sample">예시</span>':''}<div class="muted" style="font-size:13px">${esc(s.forWhom)}</div></td>
      <td class="hide-m">${esc(s.founder)}</td>
      <td class="num">${basics(s).length}</td><td class="num">${electives(s).length}</td><td class="num">${st.length}</td>
      <td class="num hide-m muted">${fmt(s.createdAt)}</td>
      <td class="num"><a class="lbtn" href="./?s=${s.id}" target="_blank" onclick="event.stopPropagation()">열기</a>${s.isSample?'':`<button class="lbtn del" onclick="event.stopPropagation();delSchool('${s.id}')">삭제</button>`}</td>
    </tr>`;
    if (!open.has(s.id)) return row;
    const cl = arr => arr.length ? `<ul class="cl">${arr.map(c=>`<li>${esc(c.name)} ${c.kind==='new'?`<span class="tag new">새 과목${c.group?' · '+esc(c.group):''}</span>`:`<span class="tag">${esc(c.group)} · ${esc(c.type)}</span>`}${c.desc?`<div class="why">${esc(c.desc)}</div>`:''}${(c.why||'').trim()?`<div class="why">이유: ${esc(c.why)}</div>`:''}</li>`).join('')}</ul>` : '<div class="muted">없음</div>';
    const name = id => (s.courses||[]).find(c=>c.id===id)?.name || '?';
    return row + `<tr class="detail"><td colspan="7">
      ${s.goal?`<div style="margin-bottom:12px"><span class="muted">교육 목표</span> ${esc(s.goal)}</div>`:''}
      <div class="dgrid">
        <div><h4>기본과목 ${basics(s).length}</h4>${cl(basics(s))}</div>
        <div><h4>선택과목 ${electives(s).length}</h4>${cl(electives(s))}</div>
      </div>
      <h4 style="margin:18px 0 6px;font-size:13px;color:var(--sub)">시간표 ${st.length}</h4>
      ${st.length ? st.map(t=>`<div class="stuline"><div><b>${esc(t.student)}</b> ${t.founder?'<span class="tag">설립자</span>':''} <span class="n">${(t.picks||[]).map(name).map(esc).join(' · ')}</span>${t.note?`<div class="n">${esc(t.note)}</div>`:''}</div>${s.isSample && ['학생 A','학생 B'].includes(t.student)?'':`<button class="lbtn del" onclick="delTT('${t.id}')">삭제</button>`}</div>`).join('') : '<div class="muted">없음</div>'}
    </td></tr>`;
  }).join('');
  $('list').querySelectorAll('tr.row').forEach(tr => tr.onclick = ()=>{ const id=tr.dataset.id; open.has(id)?open.delete(id):open.add(id); renderList(); });
}

function bars(map, el, limit=12){
  const arr = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  if (!arr.length){ $(el).innerHTML = '<div class="empty">아직 없어요.</div>'; return; }
  const max = arr[0][1];
  $(el).innerHTML = arr.map(([k,v])=>`<div class="bar"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="display:block;width:${v/max*100}%"></span></span><span class="c">${v}</span></div>`).join('');
}
function renderRank(){
  const r = real(), openM = {}, basicM = {}, groupM = {}, pickM = {};
  r.forEach(s => {
    electives(s).forEach(c => { openM[c.name]=(openM[c.name]||0)+1; const g = c.group || (c.kind==='new'?'(교과 미지정)':''); if (g) groupM[g]=(groupM[g]||0)+1; });
    basics(s).forEach(c => basicM[c.name]=(basicM[c.name]||0)+1);
  });
  realTT().forEach(t => { const s = r.find(x=>x.id===t.schoolId); (t.picks||[]).forEach(id => { const c = s && (s.courses||[]).find(x=>x.id===id); if (c) pickM[c.name]=(pickM[c.name]||0)+1; }); });
  bars(openM,'rOpen'); bars(pickM,'rPick'); bars(basicM,'rBasic'); bars(groupM,'rGroup');
}
function renderNew(){
  const items = [];
  real().forEach(s => (s.courses||[]).filter(c=>c.kind==='new').forEach(c => items.push({s,c})));
  $('newCount').textContent = `${items.length}개`;
  $('newList').innerHTML = items.length ? items.map(({s,c})=>`<div class="item">
    <b>${esc(c.name)}</b> <span class="meta">${esc(c.group||'')} · ${roleOf(c)==='basic'?'기본':'선택'} · ${esc(s.name)} (${esc(s.founder)})</span>
    ${c.desc?`<div class="desc">${esc(c.desc)}</div>`:''}
    ${(c.why||'').trim()?`<div class="why">이유: ${esc(c.why)}</div>`:''}
  </div>`).join('') : '<div class="empty">아직 없어요.</div>';
}

async function delSchool(id){
  const s = schools.find(x=>x.id===id); if (!s || s.isSample) return;
  if (!confirm(`'${s.name}'을(를) 지울까요? 이 학교 시간표도 함께 지워져요.`)) return;
  await Promise.all(tts.filter(t=>t.schoolId===id).map(t=>TT.doc(t.id).delete()));
  await SCH.doc(id).delete(); open.delete(id); toast('지웠어요.');
}
async function delTT(id){
  const t = tts.find(x=>x.id===id); if (!t) return;
  if (!confirm(`${t.student}의 시간표를 지울까요?`)) return;
  await TT.doc(id).delete(); toast('지웠어요.');
}
async function wipeAll(){
  const r = real(); if (!r.length) return toast('지울 학교가 없어요.');
  if (!confirm(`예시 학교를 빼고 학교 ${r.length}개와 시간표를 모두 지울까요?`)) return;
  if (prompt('되돌릴 수 없어요. 계속하려면 "지우기"라고 입력하세요.') !== '지우기') return toast('취소했어요.');
  const ids = new Set(r.map(s=>s.id));
  await Promise.all(tts.filter(t=>ids.has(t.schoolId)).map(t=>TT.doc(t.id).delete()));
  await Promise.all(r.map(s=>SCH.doc(s.id).delete()));
  // 예시 학교에 입학한 사람들 시간표도 정리 (A·B만 남김)
  const sample = schools.find(s=>s.isSample);
  if (sample) await Promise.all(tts.filter(t=>t.schoolId===sample.id && !['학생 A','학생 B'].includes(t.student)).map(t=>TT.doc(t.id).delete()));
  toast('모두 지웠어요.');
}
</script>
</body>
</html>
